name: ASPM CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'aspm/**'
      - '.github/workflows/aspm-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'aspm/**'

jobs:
  aspm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # Instalar Trivy
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          version: v0.59.0 # o la última disponible

      # Instalar dependencias de Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ejecutar Trivy y generar el JSON
      - name: Run Trivy (generar JSON)
        run: trivy fs --scanners vuln --format json --output app_trivy.json app/ || true

      # Descargar EPSS y KEV (tu script de Subpaso 1)
      - name: Fetch EPSS & KEV
        run: python aspm/fetch_sources.py

      # Ejecutar priorizador (tu script de Subpaso 2)
      - name: Run ASPM Priorization
        run: python aspm/prioritize.py