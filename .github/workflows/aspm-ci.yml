name: ASPM CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'aspm/**'
      - '.github/workflows/aspm-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'aspm/**'

jobs:
  aspm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          tar zxvf trivy_0.76.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trivy (generate JSON)
        run: trivy fs --scanners vuln --format json --output app_trivy.json app/ || true

      - name: Fetch EPSS & KEV
        run: python aspm/fetch_sources.py

      - name: Run ASPM Prioritization
        run: python aspm/prioritize.py