name: Detection CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sigma check
        run: sigma check --fail-on-issues detections/

      - name: Pytest
        run: pytest -v

      - name: Sigma convert (Lucene/ECS)
        run: sigma convert -t lucene -p ecs_windows detections/windows/