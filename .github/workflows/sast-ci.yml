name: SAST CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/sast-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep
        run: semgrep --config=p/python --severity=ERROR --error app/