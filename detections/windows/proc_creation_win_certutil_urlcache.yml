title: Certutil Download Via URLcache
id: 2b3c4d5e-6f70-4a8b-9c1d-2e3f4a5b6c7d
status: experimental
description: Detecta descarga de payload con certutil usando -urlcache.
author: SecureCloud-Pipeline
date: 2026/10/14
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\certutil.exe'
  selection_cli:
    CommandLine|contains:
      - 'urlcache'
      - '-verifyctl'
  condition: selection_img and selection_cli
falsepositives:
  - Administración legítima de PKI
level: high
tags:
  - attack.stealth
  - attack.t1140