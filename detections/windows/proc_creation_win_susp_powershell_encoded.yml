title: Suspicious PowerShell Encoded Command
id: 8f3b2c1a-4d5e-4f6a-9b7c-1d2e3f4a5b6c
status: experimental
description: Detecta PowerShell ejecutado con comando codificado en Base64.
author: SecureCloud-Pipeline
date: 2026/10/14
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
  condition: selection
falsepositives:
  - Scripts administrativos legítimos
level: high
tags:
  - attack.execution
  - attack.t1059.001